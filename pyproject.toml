[project]
name = "distance-to-default"
version = "0.1.0"
description = "Distance-to-default and implied PD for a public firm via the structural Merton model."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Davi Liberato" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "yfinance>=0.2.43",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distance_to_default"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=distance_to_default --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

